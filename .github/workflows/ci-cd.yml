name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enforce Markdown Line Caps (TCH-01)
        run: |
          check_cap() {
            local file="$1"
            local cap="$2"
            local lines
            lines=$(wc -l < "$file" | tr -d ' ')
            echo "$file: $lines / $cap lines"
            if [ "$lines" -gt "$cap" ]; then
              echo "::error file=$file::$file has $lines lines (exceeds cap of $cap)"
              exit 1
            fi
          }
          check_cap "docs/SPEC.md" 80
          check_cap "docs/STATUS.md" 30
          for spec in docs/specs/*.md; do
            check_cap "$spec" 80
          done

      - name: Setup Node.js Engine (TCH-08)
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: npm

      - name: Install, Lint, Test & Build (TCH-02, TCH-03)
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Configure GitHub Pages (TCH-04)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact (TCH-04)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: quality-gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (TCH-04)
        id: deployment
        uses: actions/deploy-pages@v4
